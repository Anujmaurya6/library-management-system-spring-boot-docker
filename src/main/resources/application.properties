# =====================================================
# Application Name
# =====================================================
spring.application.name=library-management-system


# =====================================================
# PostgreSQL Database Configuration
# =====================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/LibrarySystem}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA / Hibernate Configuration
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =====================================================
# Server Configuration
# =====================================================
server.port=8080


# =====================================================
# Swagger / OpenAPI Configuration
# =====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# =====================================================
# Logging Configuration
# =====================================================
logging.level.root=INFO
logging.level.com.example.library.management.system=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

logging.file.name=logs/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n


# =====================================================
# JWT Configuration
# =====================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000